    caveat: "reports via Slack, so a dead Slack bot token silences the guard and the pipeline together"

schedulers:                             # all six ENABLED, verified 2026-08-19; created/updated ONLY by n8n-ops/deploy.sh
  - {name: n8n-ops-ingest,         cron: "*/15 * * * *", tz: UTC,            endpoint: /ingest}
  - {name: n8n-ops-loop-alerts,    cron: "*/10 * * * *", tz: UTC,            endpoint: /loop-alerts}
  - {name: n8n-ops-sweep-zombies,  cron: "*/30 * * * *", tz: UTC,            endpoint: /sweep-zombies}
  - {name: n8n-ops-sync-hub,       cron: "15 6 * * *",   tz: UTC,            endpoint: /sync-hub}
  - {name: n8n-ops-weekly-digest,  cron: "0 9 * * 1",    tz: Asia/Jerusalem, endpoint: /weekly-digest}
  - {name: n8n-ops-kpi-rollup,     cron: "0 2 1 * *",    tz: UTC,            endpoint: /kpi-rollup}

# A 7th Cloud Scheduler job that deploy.sh does NOT own — re-running deploy.sh will not recreate it.
extra_scheduler:
  name: n8n-kpi-freshness-cron
  cron: "*/15 * * * *"
  tz: Asia/Jerusalem
  state: ENABLED
  drives: n8n-kpi-freshness-alarm

# NOT a Cloud Scheduler job at all. Lives in BigQuery. Easiest thing here to miss.
bigquery:
  dataset: agentic-workflows-485210.n8n_ops
  tables: [executions, workflows, daily_workflow_stats, hermes_heartbeat]
  health_2026_08_19: "executions = 313,115 rows; last execution 10 min before the read. HEALTHY."
  scheduled_query:
    name: daily_rollup
    cron: "08:30 Asia/Jerusalem"
    populates: daily_workflow_stats
    consumed_by: /kpi-rollup
    note: "if this stops, the monthly KPI reads stale stats and Cloud Scheduler still looks healthy"

